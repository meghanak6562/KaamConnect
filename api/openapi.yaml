openapi: 3.0.3
info:
  title: KaamConnect API (Proposed Specification)
  version: 0.1.0-draft
  description: >
    Proposed REST API contract for KaamConnect — a hyper-local, voice-enabled
    job matching platform connecting informal and semi-skilled workers with
    nearby employers. Note: This is an architectural specification; no live
    FastAPI server is deployed in this repository.
servers:
  - url: https://api.kaamconnect.example.com
    description: Proposed production API endpoint

tags:
  - name: Authentication
  - name: Workers
  - name: Employers
  - name: Jobs
  - name: Matching
  - name: Applications

components:
  securitySchemes:
    FirebaseBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase Authentication ID token passed as Bearer token.
  schemas:
    UserRegisterRequest:
      type: object
      required: [full_name, phone, role, preferred_language]
      properties:
        full_name:
          type: string
          example: Ramesh Kumar
        phone:
          type: string
          example: "+919876543210"
        role:
          type: string
          enum: [worker, employer]
          example: worker
        preferred_language:
          type: string
          enum: [kn, hi, en]
          example: kn
    WorkerProfileRequest:
      type: object
      required: [profession, skills, experience, expected_wage, availability, latitude, longitude]
      properties:
        profession:
          type: string
          example: electrician
        skills:
          type: array
          items:
            type: string
          example: ["wiring", "mcb_repair", "inverter_install"]
        experience:
          type: number
          example: 5
        expected_wage:
          type: number
          example: 700
        availability:
          type: string
          enum: [available, busy, unavailable]
          example: available
        latitude:
          type: number
          example: 13.3379
        longitude:
          type: number
          example: 77.1173
    EmployerProfileRequest:
      type: object
      required: [business_name, contact_details, location]
      properties:
        business_name:
          type: string
          example: Sri Sai Electricals & Hardware
        contact_details:
          type: string
          example: "+919845012345"
        location:
          type: string
          example: Tumakuru, Karnataka
    JobCreateRequest:
      type: object
      required: [title, description, required_skills, offered_wage, latitude, longitude]
      properties:
        title:
          type: string
          example: House Rewiring and MCB Board Repair
        description:
          type: string
          example: Need an experienced electrician for 2-day residential wiring work.
        required_skills:
          type: array
          items:
            type: string
          example: ["wiring", "mcb_repair"]
        offered_wage:
          type: number
          example: 750
        latitude:
          type: number
          example: 13.3420
        longitude:
          type: number
          example: 77.1210
    ApplicationCreateRequest:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
          example: j_201
    MatchResult:
      type: object
      properties:
        target_id:
          type: string
          example: j_201
        total_score:
          type: number
          example: 92.4
        distance_km:
          type: number
          example: 0.61
        reasons:
          type: array
          items:
            type: string
          example:
            - "Matched 2/2 required skills: wiring, mcb_repair"
            - "0.61 km away (within 15.0 km radius)"

security:
  - FirebaseBearerAuth: []

paths:
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user profile
      description: Creates a user record in Firestore after Firebase Phone OTP verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              example:
                uid: u_101
                full_name: Ramesh Kumar
                role: worker
                preferred_language: kn

  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get current authenticated user
      responses:
        "200":
          description: Authenticated user details
          content:
            application/json:
              example:
                uid: u_101
                full_name: Ramesh Kumar
                phone: "+919876543210"
                role: worker
                preferred_language: kn

  /api/workers/profile:
    post:
      tags: [Workers]
      summary: Create or update worker profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerProfileRequest"
      responses:
        "200":
          description: Worker profile saved
          content:
            application/json:
              example:
                worker_id: w_101
                status: saved

  /api/workers/nearby:
    get:
      tags: [Workers]
      summary: Find nearby available workers
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
          example: 13.3420
        - name: lng
          in: query
          required: true
          schema:
            type: number
          example: 77.1210
        - name: radius_km
          in: query
          required: false
          schema:
            type: number
            default: 10
        - name: skill
          in: query
          required: false
          schema:
            type: string
          example: wiring
      responses:
        "200":
          description: List of nearby workers
          content:
            application/json:
              example:
                count: 1
                workers:
                  - worker_id: w_101
                    profession: electrician
                    distance_km: 0.61
                    availability: available

  /api/employers/profile:
    post:
      tags: [Employers]
      summary: Create or update employer profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployerProfileRequest"
      responses:
        "200":
          description: Employer profile saved
          content:
            application/json:
              example:
                employer_id: e_501
                status: saved

  /api/employers/profile/{id}:
    get:
      tags: [Employers]
      summary: Get employer profile by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: e_501
      responses:
        "200":
          description: Employer profile details
          content:
            application/json:
              example:
                employer_id: e_501
                business_name: Sri Sai Electricals & Hardware
                location: Tumakuru, Karnataka

  /api/jobs:
    post:
      tags: [Jobs]
      summary: Post a new hyper-local job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCreateRequest"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              example:
                job_id: j_201
                job_status: open
    get:
      tags: [Jobs]
      summary: List open jobs
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: open
      responses:
        "200":
          description: Array of open job listings
          content:
            application/json:
              example:
                jobs:
                  - job_id: j_201
                    title: House Rewiring and MCB Board Repair
                    offered_wage: 750
                    job_status: open

  /api/jobs/{id}:
    get:
      tags: [Jobs]
      summary: Get job details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: j_201
      responses:
        "200":
          description: Job details
          content:
            application/json:
              example:
                job_id: j_201
                title: House Rewiring and MCB Board Repair
                required_skills: ["wiring", "mcb_repair"]
                offered_wage: 750
                job_status: open

  /api/matching/jobs:
    get:
      tags: [Matching]
      summary: Get ranked nearby jobs for a worker
      parameters:
        - name: worker_id
          in: query
          required: true
          schema:
            type: string
          example: w_101
        - name: max_distance_km
          in: query
          required: false
          schema:
            type: number
            default: 15
      responses:
        "200":
          description: Ranked matching jobs with score breakdown and reasons
          content:
            application/json:
              schema:
                type: object
                properties:
                  worker_id:
                    type: string
                  matches:
                    type: array
                    items:
                      $ref: "#/components/schemas/MatchResult"

  /api/matching/workers:
    get:
      tags: [Matching]
      summary: Get ranked nearby workers for a job
      parameters:
        - name: job_id
          in: query
          required: true
          schema:
            type: string
          example: j_201
        - name: max_distance_km
          in: query
          required: false
          schema:
            type: number
            default: 15
      responses:
        "200":
          description: Ranked matching workers with score breakdown and reasons
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  matches:
                    type: array
                    items:
                      $ref: "#/components/schemas/MatchResult"

  /api/applications:
    post:
      tags: [Applications]
      summary: Submit a job application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationCreateRequest"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              example:
                application_id: a_901
                job_id: j_201
                application_status: pending

  /api/applications/worker:
    get:
      tags: [Applications]
      summary: List applications for the authenticated worker
      responses:
        "200":
          description: Worker applications
          content:
            application/json:
              example:
                applications:
                  - application_id: a_901
                    job_id: j_201
                    application_status: pending

  /api/applications/employer:
    get:
      tags: [Applications]
      summary: List applications received by the authenticated employer
      responses:
        "200":
          description: Employer applications
          content:
            application/json:
              example:
                applications:
                  - application_id: a_901
                    job_id: j_201
                    worker_id: w_101
                    application_status: pending
